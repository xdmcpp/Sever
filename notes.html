    <!-- 主要内容 -->
    <main class="container mx-auto px-4 pt-24 pb-12">
        <!-- 页面标题 -->
        <section class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 dark:text-white mb-4">学习笔记</h1>
            <p class="text-lg text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">
                记录你的学习心得和重要知识点，方便复习和巩固所学内容。
            </p>
        </section>

        <!-- 添加笔记表单 -->
        <section class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-4">添加笔记</h2>
            
            <form id="note-form" class="space-y-4">
                <input type="hidden" id="note-id" value="">
                
                <div class="form-group">
                    <label for="note-title" class="form-label text-gray-700 dark:text-gray-300">标题</label>
                    <input type="text" id="note-title" class="form-control" placeholder="输入笔记标题" required>
                </div>
                
                <div class="form-group">
                    <label for="note-content" class="form-label text-gray-700 dark:text-gray-300">内容</label>
                    <textarea id="note-content" class="form-control" rows="6" placeholder="输入笔记内容" required></textarea>
                </div>
                
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancel-note-btn" class="btn btn-outline">取消</button>
                    <button type="submit" id="save-note-btn" class="btn btn-primary">添加笔记</button>
                </div>
            </form>
        </section>

        <!-- 笔记列表 -->
        <section class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800 dark:text-white">我的笔记</h2>
                
                <div class="flex items-center">
                    <label for="notes-search" class="mr-2 text-gray-700 dark:text-gray-300">搜索:</label>
                    <input type="text" id="notes-search" class="form-control py-1 px-2 text-sm" placeholder="搜索笔记...">
                </div>
            </div>
            
            <div id="notes-list" class="space-y-4">
                <!-- 笔记将通过JavaScript动态加载 -->
                <div class="text-center py-8 text-gray-500">暂无笔记，点击上方按钮添加</div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->

                            <i class="fas fa-envelope mr-2 text-gray-400"></i>

    <!-- JavaScript -->
    <script src="script.js"></script>
    <script>
        // 页面加载完成后初始化笔记功能
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化笔记功能
            initNotes();
            
            // 笔记搜索功能
            const notesSearch = document.getElementById('notes-search');
            const notesList = document.getElementById('notes-list');
            
            if (notesSearch && notesList) {
                notesSearch.addEventListener('input', () => {
                    const searchTerm = notesSearch.value.toLowerCase().trim();
                    const noteElements = notesList.querySelectorAll('.bg-white.dark\\:bg-gray-800');
                    
                    if (searchTerm === '') {
                        // 如果搜索词为空，显示所有笔记
                        noteElements.forEach(note => {
                            note.style.display = 'block';
                        });
                        return;
                    }
                    
                    // 搜索笔记标题和内容
                    noteElements.forEach(note => {
                        const title = note.querySelector('h3').textContent.toLowerCase();
                        const content = note.querySelector('p').textContent.toLowerCase();
                        
                        if (title.includes(searchTerm) || content.includes(searchTerm)) {
                            note.style.display = 'block';
                        } else {
                            note.style.display = 'none';
                        }
                    });
                });
            }
        });
    </script>
